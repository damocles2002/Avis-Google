<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes QR Codes - DAMAVIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="icon" type="image/png" href="icons/favicon-32.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#042C53">
    <style>
        body { font-family: 'Open Sans', sans-serif; }
        h1, h2 { font-family: 'Times New Roman', serif; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-[#202124] min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 max-w-md w-full">
        <h1 class="text-xl font-bold mb-1">📱 Mes QR Codes</h1>
        <p class="text-sm text-gray-500 mb-5">À imprimer et poser sur les tables.</p>

        <div class="mb-4">
            <label class="block text-xs font-semibold text-gray-500 mb-1">ID du restaurant</label>
            <input type="text" id="id-resto" placeholder="ID du restaurant..." class="w-full p-3 rounded-lg border border-gray-300 text-sm">
        </div>
        <div class="mb-4">
            <label class="block text-xs font-semibold text-gray-500 mb-1">Nom du restaurant (sur le QR)</label>
            <input type="text" id="nom-resto" placeholder="Ex : Le Coq Noir" class="w-full p-3 rounded-lg border border-gray-300 text-sm">
        </div>
        <button onclick="genererTout()" class="w-full bg-[#042C53] text-white font-bold py-3 rounded-lg mb-6">Générer mes QR codes</button>

        <div id="resultats" class="hidden space-y-8">
            <!-- QR Avis -->
            <div class="text-center">
                <h2 class="font-semibold mb-2 text-lg">⭐ Avis clients</h2>
                <div class="bg-[#042C53] p-4 rounded-xl inline-block">
                    <div id="qr-avis"></div>
                </div>
                <p class="text-xs text-gray-400 mt-2">Le client scanne → laisse son avis</p>
                <a onclick="composerCarte('avis')" class="mt-3 inline-block bg-[#1a73e8] text-white text-sm font-medium py-2 px-6 rounded-full cursor-pointer">⬇️ Télécharger</a>
            </div>

            <!-- QR Jukebox -->
            <div class="text-center">
                <h2 class="font-semibold mb-2 text-lg">🎵 Musique (jukebox)</h2>
                <div class="bg-[#042C53] p-4 rounded-xl inline-block">
                    <div id="qr-jukebox"></div>
                </div>
                <p class="text-xs text-gray-400 mt-2">Le client scanne → vote pour la musique</p>
                <a onclick="composerCarte('jukebox')" class="mt-3 inline-block bg-[#1a73e8] text-white text-sm font-medium py-2 px-6 rounded-full cursor-pointer">⬇️ Télécharger</a>
            </div>
        </div>
    </div>
    <script>
        const BASE = "https://damocles2002.github.io/Avis-Google/";

        // Pré-remplir l'ID + le nom depuis l'URL (?id=...&nom=...)
        const params = new URLSearchParams(window.location.search);
        if (params.get('id')) {
            document.getElementById('id-resto').value = params.get('id');
        }
        if (params.get('nom')) {
            document.getElementById('nom-resto').value = params.get('nom');
        }
        if (params.get('id')) {
            genererTout();
        }

        function genererTout() {
            const id = document.getElementById('id-resto').value.trim();
            if (!id) { alert("Veuillez entrer l'ID du restaurant."); return; }

            const lienAvis = BASE + "avis.html?id=" + id;
            const lienJukebox = BASE + "jukebox.html?id=" + id;

            document.getElementById('qr-avis').innerHTML = "";
            document.getElementById('qr-jukebox').innerHTML = "";

            // QR blanc sur fond bleu nuit (comme le modèle), 400px pour la netteté
            new QRCode(document.getElementById('qr-avis'), {
                text: lienAvis, width: 400, height: 400,
                colorDark: "#ffffff", colorLight: "#042C53",
                correctLevel: QRCode.CorrectLevel.H
            });
            new QRCode(document.getElementById('qr-jukebox'), {
                text: lienJukebox, width: 400, height: 400,
                colorDark: "#ffffff", colorLight: "#042C53",
                correctLevel: QRCode.CorrectLevel.H
            });

            document.getElementById('resultats').classList.remove('hidden');

            // réduire l'aperçu (le canvas reste 400px pour la carte)
            setTimeout(() => {
                const cAvis = document.querySelector('#qr-avis canvas');
                const cJuk = document.querySelector('#qr-jukebox canvas');
                if (cAvis) { cAvis.style.width = '160px'; cAvis.style.height = '160px'; }
                if (cJuk) { cJuk.style.width = '160px'; cJuk.style.height = '160px'; }
            }, 100);
        }

        // Compose la carte complète (fond bleu nuit + logo + nom + QR + service) et la télécharge
        function composerCarte(type) {
            const id = document.getElementById('id-resto').value.trim();
            const nom = document.getElementById('nom-resto').value.trim() || 'Restaurant';
            const canvas = document.createElement('canvas');
            canvas.width = 800; canvas.height = 1000;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#042C53';
            ctx.fillRect(0, 0, 800, 1000);
            const logo = new Image();
            logo.onload = function() {
                // logo DAMAVIS dans un cercle blanc
                ctx.beginPath(); ctx.arc(400, 130, 62, 0, Math.PI*2); ctx.fillStyle = '#ffffff'; ctx.fill();
                ctx.save();
                ctx.beginPath(); ctx.arc(400, 130, 56, 0, Math.PI*2); ctx.clip();
                ctx.drawImage(logo, 344, 74, 112, 112);
                ctx.restore();
                // DAMAVIS + nom du restaurant
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 42px "Times New Roman", serif'; ctx.textAlign = 'center';
                ctx.fillText('DAMAVIS', 400, 250);
                ctx.font = '26px "Times New Roman", serif';
                ctx.fillText(nom, 400, 295);
                // QR code (blanc sur bleu, net)
                const sel = '#qr-' + (type === 'avis' ? 'avis' : 'jukebox');
                const qr = document.querySelector(sel + ' canvas') || document.querySelector(sel + ' img');
                if (qr) { ctx.drawImage(qr, 200, 330, 400, 400); }
                // service + instruction
                const service = (type === 'avis') ? '⭐ Donnez votre avis' : '🎵 Choisissez la musique';
                ctx.fillStyle = '#EF9F27'; ctx.font = 'bold 34px "Times New Roman", serif';
                ctx.fillText(service, 400, 800);
                ctx.fillStyle = '#ffffff'; ctx.font = '22px "Open Sans", sans-serif';
                ctx.fillText('Scannez ce QR code', 400, 850);
                // téléchargement
                const a = document.createElement('a');
                a.href = canvas.toDataURL('image/png');
                a.download = 'qrcode-' + (type === 'avis' ? 'avis' : 'jukebox') + '-' + id + '.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };
            logo.src = 'logo.png';
        }
    </script>
</body>
</html>
